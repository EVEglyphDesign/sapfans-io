name: Ask a question
description: Stuck on a step, or something here does not work for your setup.
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        No such thing as a basic question here. Most people setting this up
        are functional consultants, not developers.

        **Do not paste anything from a client engagement** — no data, no
        system names, no screenshots of a client system. Describe the shape of
        the problem instead.

  - type: dropdown
    id: where
    attributes:
      label: Where did you get stuck?
      options:
        - Step 1 — making the repository
        - Step 2 — adding the harness
        - Step 3 — pointing my tools at it
        - Step 4 — asking for files instead of answers
        - Usage standards
        - Something else
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: Which tool are you using?
      multiple: true
      options:
        - Claude
        - GitHub Copilot
        - Perplexity
        - ChatGPT
        - Something else
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else worth knowing?
      description: Optional. Your role, the kind of workstream, whether this is for you or a team.
    validations:
      required: false